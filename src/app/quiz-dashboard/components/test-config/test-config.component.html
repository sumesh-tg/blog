<div class="card mb-3">
    <div class="card-body">
        <div class="form-group">
            <label>Test ID</label>
            <input class="form-control" [(ngModel)]="config.id" (ngModelChange)="emitChange()" />
        </div>
        <div class="form-group">
            <label>Test Name</label>
            <input class="form-control" [(ngModel)]="config.name" (ngModelChange)="emitChange()" />
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" [(ngModel)]="config.description" (ngModelChange)="emitChange()"></textarea>
        </div>
        <div class="form-group">
            <label>Duration (minutes)</label>
            <input type="number" class="form-control" [(ngModel)]="config.duration" (ngModelChange)="emitChange()"
                min="0" />
        </div>
        <div class="form-group">
            <label>Theme</label>
            <select class="form-control" [(ngModel)]="config.theme" (ngModelChange)="emitChange()">
                <option value="default" selected>Default</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="autoMove" [(ngModel)]="config.autoMove"
                (ngModelChange)="emitChange()" />
            <label class="form-check-label" for="autoMove">Auto Move</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="shuffleQuestions" [(ngModel)]="config.shuffleQuestions"
                (ngModelChange)="emitChange()" />
            <label class="form-check-label" for="shuffleQuestions">Shuffle Questions</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="shuffleOptions" [(ngModel)]="config.shuffleOptions"
                (ngModelChange)="emitChange()" />
            <label class="form-check-label" for="shuffleOptions">Shuffle Options</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="allowReview" [(ngModel)]="config.allowReview"
                (ngModelChange)="emitChange()" />
            <label class="form-check-label" for="allowReview">Allow Review</label>
        </div>

        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="showClock" [(ngModel)]="config.showClock"
                (ngModelChange)="emitChange()" />
            <label class="form-check-label" for="showClock">Show Clock</label>
        </div>
        <div class="text-right mt-3">
            <button class="btn btn-secondary mr-2" (click)="resetConfig()">Reset</button>
            <button class="btn btn-primary" (click)="save()">Save</button>
        </div>
    </div>
</div>

<!-- Table for displaying details -->
<table class="table table-bordered mt-4">
    <thead>
        <tr>
            <th>Test ID</th>
            <th>Test Name</th>
            <th>Description</th>
            <th>Auto Move</th>
            <th>Shuffle Questions</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let config of testConfigs; let i = index">
            <td>{{ config.id }}</td>
            <td>{{ config.name }}</td>
            <td>{{ config.description }}</td>
            <td>{{ config.autoMove ? 'Yes' : 'No' }}</td>
            <td>{{ config.shuffleQuestions ? 'Yes' : 'No' }}</td>
            <td>
                <div class="btn-group" dropdown>
                    <button dropdownToggle type="button" class="btn btn-secondary dropdown-toggle">
                        Action
                    </button>
                    <ul *dropdownMenu class="dropdown-menu">
                        <li><a class="dropdown-item" (click)="onEditConfig(config)">Edit</a></li>
                        <li><a class="dropdown-item" (click)="onDeleteConfig(config)">Delete</a></li>
                        <li><a class="dropdown-item" (click)="onExportConfig(config)">Export</a></li>
                    </ul>
                </div>
            </td>
        </tr>
    </tbody>
</table>
